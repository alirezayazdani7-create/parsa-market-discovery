name: PARSA Order Lifecycle Stage 1

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/example/trading/orders/**"
      - "app/src/test/java/com/example/trading/orders/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle/libs.versions.toml"
      - "docs/ORDER_LIFECYCLE_STAGE_1.md"
      - ".github/workflows/order-lifecycle-stage1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-lifecycle-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  order-lifecycle-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Stage 1 order lifecycle tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests "com.example.trading.orders.OrderLifecycleTest"

      - name: Build debug app
        run: gradle --no-daemon :app:assembleDebug
