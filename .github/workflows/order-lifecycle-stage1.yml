name: PARSA Order Lifecycle Stage 1

on:
  push:
    branches: [feature/order-lifecycle-stage-1]
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/example/trading/orders/**"
      - "app/src/test/java/com/example/trading/orders/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle/libs.versions.toml"
      - "docs/ORDER_LIFECYCLE_STAGE_1.md"
      - "docs/ORDER_LIFECYCLE_STAGE_2.md"
      - "docs/ORDER_LIFECYCLE_STAGE_3.md"
      - "docs/ORDER_LIFECYCLE_STAGE_4.md"
      - "docs/ORDER_LIFECYCLE_STAGE_5.md"
      - ".github/workflows/order-lifecycle-stage1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-lifecycle-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  order-lifecycle-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run complete debug unit test suite
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-lifecycle-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Create ephemeral debug signing keystore
        if: success()
        run: >-
          keytool -genkeypair -v
          -keystore debug.keystore
          -storepass android
          -alias androiddebugkey
          -keypass android
          -keyalg RSA
          -keysize 2048
          -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug app
        if: success()
        run: gradle --no-daemon :app:assembleDebug --stacktrace
